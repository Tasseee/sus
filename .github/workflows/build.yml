name: Build Nightfall Fabric mod (Minecraft 1.21.11)

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Validate project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle || { echo 'ERROR: build.gradle fehlt im Repository-Root.'; exit 1; }
          test -f settings.gradle || { echo 'ERROR: settings.gradle fehlt im Repository-Root.'; exit 1; }
          test -f src/main/resources/fabric.mod.json || { echo 'ERROR: src/main/resources/fabric.mod.json fehlt.'; exit 1; }
          test -d src/main/java || { echo 'ERROR: src/main/java fehlt.'; exit 1; }

      - name: Build Fabric mod
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify remapped mod JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-dev.jar' \
            -print -quit)"
          if [ -z "$JAR_FILE" ]; then
            echo 'ERROR: Kein fertiges Mod-JAR in build/libs gefunden.'
            echo 'Vorhandene Dateien:'
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          echo "jar_path=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "Build-Artefakt: $JAR_FILE"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client-Minecraft-1.21.11-${{ github.run_number }}
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 14
